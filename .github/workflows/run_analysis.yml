name: Update On-Chain Dashboard

on:
  schedule:
    - cron: '0 6 * * *' # Τρέχει αυτόματα κάθε μέρα στις 08:00 το πρωί ώρα Ελλάδος
  workflow_dispatch: # Μας επιτρέπει να το τρέχουμε χειροκίνητα όποτε θέλουμε

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run Analysis
      run: python fetch_onchain.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add README.md
        git commit -m "Auto-update on-chain dashboard" || exit 0
        git push
